<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PdfStampPicker v4.1 — 多用户多签章坐标选择器 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #202124; color: #e8eaed; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: #292a2d; border-bottom: 1px solid #3c4043; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; }
  header .tag { font-size: 11px; color: #9aa0a6; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { border: 1px solid #5f6368; background: transparent; color: #e8eaed; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .tabs button.active { background: #4285f4; border-color: #4285f4; }
  .tabs button:hover:not(.active) { background: #35363a; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; min-width: 0; position: relative; }
  aside { width: 300px; border-left: 1px solid #3c4043; display: flex; flex-direction: column; min-height: 0; background: #292a2d; }
  aside h2 { font-size: 12px; font-weight: 600; padding: 10px 12px 6px; color: #9aa0a6; }
  #info { padding: 0 12px 6px; font-size: 11px; color: #8ab4f8; }
  #output { flex: 1; overflow: auto; padding: 8px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-all; background: #1f2022; margin: 0 10px 10px; border-radius: 6px; border: 1px solid #3c4043; }
  #output .dim { color: #9aa0a6; }
  .actions { display: flex; gap: 8px; padding: 0 12px 10px; flex-wrap: wrap; }
  .actions button { background: #3c4043; color: #e8eaed; border: none; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
  .actions button:hover { background: #4a4d51; }
  .actions button.active { background: #4285f4; }
  .actions button.primary { background: #34a853; }
  .actions button.primary:hover { background: #3cb85f; }
  .users { display: flex; gap: 6px; padding: 0 12px 8px; flex-wrap: wrap; }
  .users button { border: 1px solid #5f6368; background: transparent; color: #e8eaed; border-radius: 16px; padding: 3px 12px; font-size: 11px; cursor: pointer; }
  .users button.active { border-color: transparent; font-weight: 600; }
  .users button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .badge { display: inline-block; background: #34a853; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>PdfStampPicker <span class="tag">v4.1.0 · 单文件零依赖</span></h1>
  <nav class="tabs">
    <button id="tab-container" class="active">容器模式（多用户/多签章）</button>
    <button id="tab-canvas">纯画布模式</button>
    <button id="tab-modal">弹窗模式</button>
  </nav>
</header>
<main>
  <div id="stage"></div>
  <aside>
    <h2>签署方管理 <span class="badge">可动态增删</span></h2>
    <div class="users" id="users"></div>
    <div style="display:flex;gap:6px;padding:0 12px 8px">
      <input id="new-user" type="text" placeholder="输入公司/签署方名称，回车添加" style="flex:1;background:#2a2d33;color:#e8eaed;border:1px solid #3c4043;border-radius:6px;padding:5px 8px;font-size:11px;outline:none">
      <button id="btn-adduser" style="background:#34a853;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer">添加</button>
    </div>
    <h2>实时 JSON 输出</h2>
    <div id="info"></div>
    <div id="output">等待操作…</div>
    <h2 style="padding-bottom:4px">选择模式</h2>
    <div class="actions">
      <button id="mode-rect" class="active">框选</button>
      <button id="mode-point">点选</button>
      <button id="mode-stamp">签章（拖公章）</button>
    </div>
    <h2 style="padding-bottom:4px">操作</h2>
    <div class="actions">
      <button id="btn-add">程序化加签章</button>
      <button id="btn-json">复制 JSON</button>
      <button id="btn-clear">清空</button>
    </div>
    <h2 style="padding-bottom:4px">加载方式</h2>
    <div class="actions">
      <button id="btn-local">📁 本地上传</button>
      <button id="btn-stream">🔗 文件流接口模拟</button>
    </div>
    <div style="padding:0 12px 10px;font-size:10.5px;color:#9aa0a6;line-height:1.6">
      💡 签章模式：点击页面即放置签章点（按住可拖动位置），滚轮缩放，图片不能拖出页面边界。内置公章上的名字 = 当前用户（切换用户自动更新）。
    </div>
  </aside>
</main>

<script src="../vendor/pdf.min.js"></script>
<script src="../pdf-stamp-picker.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = '../vendor/pdf.worker.min.js';

const stage = document.getElementById('stage');
const output = document.getElementById('output');
const info = document.getElementById('info');

const USERS = [
  { id: 'u1', name: '甲方', color: '#4285f4' },
  { id: 'u2', name: '乙方', color: '#ea4335' },
  { id: 'u3', name: '丙方', color: '#34a853' }
];

let picker = null;

// 动态渲染签署方按钮列表
function renderUsers() {
  const wrap = document.getElementById('users');
  wrap.innerHTML = '';
  const cu = picker.getCurrentUser();
  picker._users.forEach(u => {
    const btn = document.createElement('button');
    btn.dataset.id = u.id;
    btn.classList.toggle('active', u.id === cu.id);
    btn.style.borderColor = u.id === cu.id ? u.color : '#5f6368';
    btn.innerHTML = `<span class="dot" style="background:${u.color}"></span>${u.name}`;
    btn.title = u.id === cu.id ? '当前签署方' : '点击切换';
    // 删除按钮（当前用户不可删）
    if (u.id !== cu.id) {
      const del = document.createElement('span');
      del.textContent = ' ×';
      del.style.cssText = 'cursor:pointer;color:#b0b4ba;margin-left:4px;font-size:12px';
      del.title = '移除该签署方';
      del.addEventListener('click', e => {
        e.stopPropagation();
        picker.removeUser(u.id);
        renderUsers();
        renderJSON();
        info.textContent = `已移除签署方「${u.name}」及其签章点`;
      });
      btn.appendChild(del);
    }
    btn.addEventListener('click', () => {
      picker.setCurrentUser(u.id);
      renderUsers();
      info.textContent = `当前签章用户: ${picker.getCurrentUser().name}`;
    });
    wrap.appendChild(btn);
  });
}

// 添加签署方
function addUserByName(name) {
  name = (name || '').trim();
  if (!name) return;
  const id = 'u_' + Date.now().toString(36);
  picker.addUser({ id, name });
  picker.setCurrentUser(id);
  renderUsers();
  info.textContent = `已添加签署方「${name}」，当前为其设置签章点`;
}
document.getElementById('btn-adduser').addEventListener('click', () => {
  addUserByName(document.getElementById('new-user').value);
  document.getElementById('new-user').value = '';
});
document.getElementById('new-user').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    addUserByName(document.getElementById('new-user').value);
    document.getElementById('new-user').value = '';
  }
});

function renderJSON() {
  if (!picker) return;
  const json = picker.toJSON();
  output.textContent = JSON.stringify(json, null, 2);
  const total = json.users.reduce((n, g) => n + g.stamps.length, 0);
  const signed = json.users.filter(g => g.stamps.length > 0).map(g => g.user.name).join('、') || '无';
  info.textContent = `文档: ${json.document.name || '(未命名)'} · ${json.document.pages}页 · 签章点 ${total} 个（${signed}）`;
}

function initContainerMode() {
  stage.innerHTML = '';
  picker = new PdfStampPicker(stage, {
    mode: 'rect',
    controls: true,
    users: USERS,
    currentUser: 'u1',
    showGrid: false,
    zoom: 'fit-width'
  });
  picker.on('stampadd', renderJSON);
  picker.on('stampremove', renderJSON);
  picker.on('stampchange', renderJSON);
  picker.on('stampselect', renderJSON);
  picker.on('clear', renderJSON);
  picker.on('pagechange', renderJSON);
  picker.on('error', e => { info.textContent = '加载失败: ' + e.message; console.error(e); });

  // 远程静态地址加载（测试 PDF）
  picker.load('test.pdf').then(() => {
    renderJSON();
    renderUsers();
    // 预生成当前用户（甲方）的内置公章
    return picker._ensureStampImage();
  }).then(() => {
    info.textContent = '已加载 test.pdf · 可添加/移除签署方 · 签章模式拖动放置（不越界）';
  }).catch(e => {
    info.textContent = '加载失败: ' + e.message;
    console.error(e);
  });
}

// 用户切换（委托）
document.getElementById('users').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || !picker) return;
  picker.setCurrentUser(btn.dataset.id);
  document.querySelectorAll('#users button').forEach(b => b.classList.toggle('active', b === btn));
  info.textContent = `当前签章用户: ${picker.getCurrentUser().name}`;
});

// 模式切换：框选 / 点选 / 签章
document.getElementById('mode-rect').addEventListener('click', e => {
  if (!picker) return;
  picker.setMode('rect');
  setModeBtn('mode-rect');
  info.textContent = '框选模式：按住拖动绘制签章区域';
});
document.getElementById('mode-point').addEventListener('click', e => {
  if (!picker) return;
  picker.setMode('point');
  setModeBtn('mode-point');
  info.textContent = '点选模式：单击放置签章锚点';
});
document.getElementById('mode-stamp').addEventListener('click', e => {
  if (!picker) return;
  picker.setMode('stamp');
  setModeBtn('mode-stamp');
  info.textContent = '签章模式：点击放置签章点，按住拖动，滚轮缩放，公章名字=当前用户';
});
function setModeBtn(id) {
  document.querySelectorAll('#mode-rect,#mode-point,#mode-stamp').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 本地上传
document.getElementById('btn-local').addEventListener('click', () => {
  if (!picker) return;
  picker._fileInput.click();
});

// 文件流接口模拟（带自定义请求头走 fetch 分支）
document.getElementById('btn-stream').addEventListener('click', async () => {
  if (!picker) return;
  info.textContent = '正在通过文件流接口加载（fetch + 自定义头）…';
  try {
    await picker.load({ url: 'test.pdf', headers: { 'X-Requested-With': 'XMLHttpRequest', 'Authorization': 'Bearer demo-token' } });
    info.textContent = '文件流接口加载成功 ✓（模拟 {url, headers} 方式，适合带鉴权的真实接口）';
    renderJSON();
  } catch (err) {
    info.textContent = '文件流接口加载失败: ' + err.message;
  }
});

// 程序化添加
document.getElementById('btn-add').addEventListener('click', () => {
  if (!picker) return;
  const stamp = picker.addStamp({ x: 100, y: 600, width: 150, height: 80, note: '程序化添加' });
  info.textContent = `已添加签章点 ${stamp.id}（当前用户: ${picker.getCurrentUser().name}）`;
  renderJSON();
});

// 复制 JSON
document.getElementById('btn-json').addEventListener('click', async () => {
  if (!picker) return;
  await picker.copyJSON();
  info.textContent = 'JSON 已复制到剪贴板 ✅';
});

// 清空
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!picker) return;
  picker.clear();
  info.textContent = '已清空全部签章点';
  renderJSON();
});

// ============ 纯画布模式 ============
function initCanvasMode() {
  stage.innerHTML = '';
  // 宿主自行渲染"合同页"canvas（模拟：库不参与渲染，只做坐标选择）
  const W = 595.28, H = 841.89;
  const cv = document.createElement('canvas');
  const scale = 2;
  cv.width = W * scale; cv.height = H * scale;
  const ctx = cv.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
  ctx.fillStyle = '#333'; ctx.font = 'bold 22px serif'; ctx.fillText('购销合同', 40, 100);
  ctx.font = '13px sans-serif'; ctx.fillStyle = '#666';
  ctx.fillText('甲方：示例科技有限公司', 40, 150);
  ctx.fillText('乙方：示例贸易有限公司', 40, 180);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#999';
  for (let i = 0; i < 14; i++) ctx.fillText('……（合同条款正文占位）……', 40, 230 + i * 32);
  ctx.strokeStyle = '#c33'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
  ctx.strokeRect(400, 600, 150, 90); ctx.fillStyle = '#c33'; ctx.font = '11px sans-serif'; ctx.fillText('盖章区', 455, 645);
  ctx.setLineDash([]);
  ctx.strokeStyle = '#36c'; ctx.strokeRect(80, 680, 180, 50); ctx.fillStyle = '#36c'; ctx.fillText('签字处', 150, 710);

  picker = new PdfStampPicker(stage, { mode: 'stamp', controls: true, users: USERS, currentUser: 'u2' });
  ['stampadd','stampremove','stampchange','stampselect','clear','pagechange'].forEach(t => picker.on(t, renderJSON));
  picker.on('error', e => { info.textContent = '错误: ' + e.message; console.error(e); });
  picker.setPage({ canvas: cv, width: W, height: H, rotation: 0, pageNumber: 1, totalPages: 1, name: 'canvas合同.pdf' });
  picker._ensureStampImage().then(() => {
    renderUsers();
    info.textContent = '纯画布模式：宿主渲染 canvas，库只做坐标选择（setPage）';
    renderJSON();
  });
}

// ============ Tab 切换 ============
function switchTab(activeId) {
  ['tab-container','tab-canvas','tab-modal'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === activeId);
  });
}
document.getElementById('tab-container').addEventListener('click', () => {
  if (document.getElementById('tab-container').classList.contains('active')) return;
  switchTab('tab-container');
  if (picker) { try { picker.destroy(); } catch (e) {} }
  initContainerMode();
});
document.getElementById('tab-canvas').addEventListener('click', () => {
  if (document.getElementById('tab-canvas').classList.contains('active')) return;
  switchTab('tab-canvas');
  if (picker) { try { picker.destroy(); } catch (e) {} }
  initCanvasMode();
});
document.getElementById('tab-modal').addEventListener('click', () => {
  if (document.getElementById('tab-modal').classList.contains('active')) return;
  switchTab('tab-modal');

  // 一键弹窗：确认后返回 JSON
  PdfStampPicker.openModal({
    source: 'test.pdf',   // 也支持 File / {url, headers} / ArrayBuffer
    title: '选择签章位置（弹窗模式）',
    users: USERS,
    currentUser: 'u2',
    confirmText: '确认签章',
    cancelText: '取消',
    requireStamp: true,   // 必须有签章点才能确认
    pickerOptions: { controls: true, zoom: 'fit-width', mode: 'stamp' },
    onConfirm: json => { const n = json.users.reduce((a, g) => a + g.stamps.length, 0); console.log('用户确认，签章点数量:', n); }
  }).then(json => {
    if (json) {
      const n = json.users.reduce((a, g) => a + g.stamps.length, 0);
      info.textContent = `弹窗确认：返回 ${n} 个签章点（按用户分组）JSON`;
      output.textContent = JSON.stringify(json, null, 2);
    } else {
      info.textContent = '弹窗已取消';
    }
    switchTab('tab-container');
  });
});

initContainerMode();
</script>
</body>
</html>
