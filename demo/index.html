<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PdfStampPicker v4.9.5 — 电子签章坐标选择器 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif; background: #f0f2f5; color: #202124; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e3e6ea; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; box-shadow: 0 1px 4px rgba(60,64,67,.06); z-index: 10; }
  header .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,#4285f4,#6aa9ff); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; box-shadow: 0 2px 6px rgba(66,133,244,.35); flex: none; }
  header h1 { font-size: 15px; font-weight: 600; }
  header .tag { font-size: 11px; color: #80868b; font-weight: 400; margin-left: 2px; }
  header .ver { display: inline-block; background: #e8f0fe; color: #4285f4; font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 12px; margin-left: 6px; vertical-align: middle; }
  .tabs { display: flex; gap: 4px; background: #f0f2f5; border-radius: 10px; padding: 3px; margin-left: auto; }
  .tabs button { border: none; background: transparent; color: #5f6368; border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; transition: all .15s ease; }
  .tabs button.active { background: #fff; color: #1a73e8; font-weight: 600; box-shadow: 0 1px 4px rgba(60,64,67,.12); }
  .tabs button:hover:not(.active) { color: #202124; }
  main { flex: 1; display: flex; min-height: 0; padding: 14px; gap: 14px; }
  #stage { flex: 1; min-width: 0; position: relative; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(60,64,67,.1); overflow: hidden; }
  aside { width: 330px; display: flex; flex-direction: column; min-height: 0; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(60,64,67,.1); overflow: hidden; }
  aside .panel-title { font-size: 11.5px; font-weight: 700; color: #5f6368; padding: 14px 16px 8px; letter-spacing: .4px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  aside .panel-title .icon { font-size: 13px; }
  .signers { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .signers button { border: 1px solid #e3e6ea; background: #f8f9fa; color: #3c4043; border-radius: 18px; padding: 4px 12px; font-size: 11.5px; cursor: pointer; transition: all .15s ease; display: inline-flex; align-items: center; gap: 5px; }
  .signers button .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .signers button.active { border-color: transparent; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .signers button .rm { color: #b0b4ba; font-size: 13px; margin-left: 2px; line-height: 1; }
  .signers button .rm:hover { color: #ea4335; }
  .add-signer { display: flex; gap: 6px; padding: 0 16px 8px; }
  .add-signer input { flex: 1; background: #f8f9fa; border: 1px solid #e3e6ea; border-radius: 8px; padding: 6px 10px; font-size: 11.5px; outline: none; transition: border-color .15s ease, box-shadow .15s ease; min-width: 0; }
  .add-signer input:focus { border-color: #4285f4; box-shadow: 0 0 0 3px rgba(66,133,244,.12); }
  .add-signer button { background: #34a853; color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 11.5px; cursor: pointer; font-weight: 600; transition: background .15s ease; }
  .add-signer button:hover { background: #2d9249; }
  .ops { display: flex; gap: 8px; padding: 2px 16px 12px; flex-wrap: wrap; }
  .ops button { background: #f8f9fa; border: 1px solid #e3e6ea; color: #3c4043; border-radius: 8px; padding: 6px 14px; font-size: 11.5px; cursor: pointer; transition: all .15s ease; display: inline-flex; align-items: center; gap: 5px; }
  .ops button:hover { background: #eef1f4; border-color: #c9ced4; }
  .ops button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  .ops button.primary:hover { background: #1765cc; }
  .json-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid #eef0f3; }
  .json-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; font-size: 11.5px; font-weight: 700; color: #5f6368; letter-spacing: .4px; text-transform: uppercase; }
  .json-head .json-meta { font-size: 10.5px; color: #80868b; font-weight: 400; text-transform: none; letter-spacing: 0; }
  #output { flex: 1; overflow: auto; margin: 0 12px 12px; padding: 10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 10px; color: #3c4043; }
  #output .dim { color: #9aa0a6; }
  #info { padding: 0 16px 10px; font-size: 11px; color: #1a73e8; }
  .badge { display: inline-block; background: #e8f0fe; color: #4285f4; font-size: 10px; padding: 1px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; font-weight: 600; }

  /* ===== 响应式：窄屏由「左右分栏」改为「上下堆叠」（画布在上、侧栏在下）=====
     修复前：main 恒为横向 flex + aside 固定 330px，412px 视口下画布只剩 40px 宽，
     PDF 被渲染成 50×71px，整页不可用。 */
  @media (max-width: 820px) {
    main { flex-direction: column; padding: 10px; gap: 10px; }
    #stage { flex: 1 1 auto; min-height: 240px; }
    aside { width: auto; flex: 0 1 auto; max-height: 48vh; }
    .json-wrap { min-height: 96px; }
  }
  @media (max-width: 520px) {
    header { padding: 10px 12px; gap: 10px; }
    header h1 { font-size: 13.5px; }
    header .tag { display: none; }
    .tabs { margin-left: 0; width: 100%; }
    .tabs button { flex: 1; }
    main { padding: 8px; gap: 8px; }
    aside { max-height: 52vh; }
  }
  /* 移动端浏览器地址栏会吃掉 100vh，支持 dvh 时用动态视口高度兜底 */
  @supports (height: 100dvh) { body { height: 100dvh; } }
</style>
</head>
<body>
<header>
  <div class="logo">🖊</div>
  <h1>PdfStampPicker <span class="tag">单文件 · 零依赖 · 坐标选择器</span><span class="ver" id="ver-tag">v4.9.5</span></h1>
  <nav class="tabs">
    <button id="tab-container" class="active">容器模式</button>
    <button id="tab-canvas">纯画布</button>
    <button id="tab-modal">弹窗</button>
  </nav>
</header>
<main>
  <div id="stage"></div>
  <aside>
    <div class="panel-title"><span class="icon">👥</span> 签署方管理 <span class="badge" id="signer-count">0</span></div>
    <div class="signers" id="users"></div>
    <div class="add-signer">
      <input id="new-user" type="text" placeholder="输入公司名，回车添加…">
      <button id="btn-adduser">添加</button>
    </div>
    <div class="panel-title"><span class="icon">⚡</span> 快捷操作</div>
    <div class="ops">
      <button id="btn-local">📁 本地上传</button>
      <button id="btn-json">📋 复制 JSON</button>
      <button id="btn-import">🔁 导入 JSON 回显</button>
      <button id="btn-clear">🗑 清空签章</button>
    </div>
    <div id="info"></div>
    <div class="json-wrap">
      <div class="json-head">JSON 输出 <span class="json-meta" id="json-meta"></span></div>
      <div id="output"><span class="dim">选择签章点后这里实时显示分组 JSON…</span></div>
    </div>
  </aside>
</main>

<script src="../pdf-stamp-picker.js?v=4.9.5"></script>
<script>
// pdf.js 由库自动探测加载（与真实项目一致：库自动找同目录 vendor/pdf.min.js）

const stage = document.getElementById('stage');
const output = document.getElementById('output');
const info = document.getElementById('info');
const jsonMeta = document.getElementById('json-meta');

let picker = null;

// 简单 toast（demo 用）
function toast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(32,33,36,.92);color:#fff;padding:9px 18px;border-radius:10px;font-size:12.5px;z-index:100000;box-shadow:0 6px 24px rgba(0,0,0,.3);animation:fadeUp .22s ease;pointer-events:none';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .25s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 260); }, 1500);
}
const styleEl = document.createElement('style');
styleEl.textContent = '@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}';
document.head.appendChild(styleEl);

const USERS = [
  { id: 'u1', name: '甲方', color: '#4285f4' },
  { id: 'u2', name: '乙方', color: '#ea4335' },
  { id: 'u3', name: '丙方', color: '#34a853' }
];

function renderJSON() {
  if (!picker) return;
  const json = picker.toJSON();
  output.textContent = JSON.stringify(json, null, 2);
  const total = json.users.reduce((n, g) => n + g.stamps.length, 0);
  const signed = json.users.filter(g => g.stamps.length > 0).map(g => g.user.name).join('、') || '无';
  jsonMeta.textContent = total ? `${total} 个签章点 · ${signed}` : '';
  info.textContent = total ? `✅ 已设置 ${total} 个签章点（${signed}）` : '提示：左侧选模式，在 PDF 上放置签章点';
}

function renderUsers() {
  const wrap = document.getElementById('users');
  wrap.innerHTML = '';
  if (!picker) return;
  const cu = picker.getCurrentUser();
  document.getElementById('signer-count').textContent = picker._users.length;
  picker._users.forEach(u => {
    const btn = document.createElement('button');
    btn.dataset.id = u.id;
    const isActive = u.id === cu.id;
    btn.classList.toggle('active', isActive);
    btn.style.background = isActive ? u.color : '';
    btn.style.color = isActive ? '#fff' : '';
    btn.innerHTML = `<span class="dot" style="background:${isActive ? '#fff' : u.color}"></span>${u.name}`;
    if (!isActive) {
      const rm = document.createElement('span');
      rm.className = 'rm';
      rm.textContent = '×';
      rm.title = '移除该签署方';
      rm.addEventListener('click', e => {
        e.stopPropagation();
        picker.removeUser(u.id);
        renderUsers(); renderJSON();
        toast(`已移除「${u.name}」及其签章点`);
      });
      btn.appendChild(rm);
    }
    btn.addEventListener('click', () => {
      picker.setCurrentUser(u.id);
      renderUsers();
      toast(`当前签署方：${picker.getCurrentUser().name}`);
    });
    wrap.appendChild(btn);
  });
}

function addUserByName(name) {
  name = (name || '').trim();
  if (!name) return;
  const id = 'u_' + Date.now().toString(36);
  picker.addUser({ id, name });
  picker.setCurrentUser(id);
  renderUsers();
  toast(`已添加签署方「${name}」`);
}
document.getElementById('btn-adduser').addEventListener('click', () => {
  addUserByName(document.getElementById('new-user').value);
  document.getElementById('new-user').value = '';
});
document.getElementById('new-user').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    addUserByName(document.getElementById('new-user').value);
    document.getElementById('new-user').value = '';
  }
});
document.getElementById('btn-local').addEventListener('click', () => {
  if (!picker) return;
  picker._fileInput.click();
  toast('请选择本地 PDF 文件…');
});
document.getElementById('btn-json').addEventListener('click', async () => {
  if (!picker) return;
  await picker.copyJSON();
});
document.getElementById('btn-import').addEventListener('click', () => {
  if (!picker) return;
  // 弹窗让用户输入/粘贴 JSON（演示真实场景：把后端保存的签章 JSON 回显）
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;display:flex;align-items:center;justify-content:center';
  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:14px;padding:20px;width:min(90vw,640px);box-shadow:0 12px 48px rgba(0,0,0,.4);color:#202124';
  box.innerHTML = '<h3 style="margin:0 0 8px;font-size:14px">导入 JSON 回显签章点</h3>' +
    '<p style="margin:0 0 10px;font-size:11.5px;color:#80868b">粘贴 <b>toJSON()</b> 导出的 JSON（或后端保存的签章数据），点击回显后自动恢复签署方/签章点/公章图，可继续编辑。</p>';
  const ta = document.createElement('textarea');
  ta.style.cssText = 'width:100%;height:260px;box-sizing:border-box;font:11.5px/1.5 monospace;border:1px solid #e3e6ea;border-radius:8px;padding:10px;resize:vertical;outline:none';
  ta.value = JSON.stringify({
    users: [
      { user: { id: 'u1', name: '甲方', color: '#4285f4' }, stamps: [
        { id: 'demo1', page: 1, x: 120, y: 560, width: 67.9, height: 67.9, unit: 'pt', rotation: 0, note: '示例公章', createdAt: '' }
      ]},
      { user: { id: 'u2', name: '乙方', color: '#ea4335' }, stamps: [
        { id: 'demo2', page: 1, x: 320, y: 480, width: 67.9, height: 67.9, unit: 'pt', rotation: 0, note: '', createdAt: '' }
      ]}
    ]
  }, null, 2);
  const foot = document.createElement('div');
  foot.style.cssText = 'display:flex;justify-content:flex-end;gap:10px;margin-top:12px';
  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = '取消';
  cancelBtn.style.cssText = 'border:1px solid #e3e6ea;background:#f8f9fa;color:#3c4043;border-radius:8px;padding:7px 18px;font-size:12.5px;cursor:pointer';
  const okBtn = document.createElement('button');
  okBtn.textContent = '回显';
  okBtn.style.cssText = 'background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:7px 24px;font-size:12.5px;font-weight:600;cursor:pointer';
  foot.appendChild(cancelBtn);
  foot.appendChild(okBtn);
  box.appendChild(ta);
  box.appendChild(foot);
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  cancelBtn.addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  okBtn.addEventListener('click', async () => {
    let json;
    try {
      json = JSON.parse(ta.value);
    } catch (e) {
      toast('❌ JSON 格式错误：' + e.message);
      return;
    }
    try {
      await picker.importJSON(json);
      renderJSON(); renderUsers();
      overlay.remove();
      toast('✅ JSON 已回显（签署方/签章点/公章图全部恢复）');
    } catch (e) {
      toast('❌ 回显失败：' + e.message);
    }
  });
});
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!picker) return;
  picker.clear();
  renderJSON(); renderUsers();
  toast('已清空全部签章点');
});

function bindPicker(p) {
  ['stampadd','stampremove','stampchange','stampselect','clear','pagechange'].forEach(t => p.on(t, () => { renderJSON(); renderUsers(); }));
  p.on('error', e => { info.textContent = '加载失败: ' + e.message; console.error(e); });
  p.on('stampadd', () => toast('签章点已放置 ✓'));
  p.on('stampremove', () => toast('已删除签章点'));
}

function initContainerMode() {
  stage.innerHTML = '';
  picker = new PdfStampPicker(stage, {
    mode: 'stamp',
    controls: true,
    users: USERS,
    currentUser: 'u1',
    zoom: 'fit-width',
    stampMargin: 12   // 签章距页面边界间距（可改为 0 紧贴）
  });
  bindPicker(picker);
  window.__picker = picker;   // 供自动回归套件取实例
  // 旧浏览器（Edge 90/Chrome 91/FF 89 等）检测：仅 compatCheck:true 时提前提示升级（库 load 也会拦，这里更早）
  // ★ 默认 false = 自动兼容（polyfill 兜底），不提示；用实例的 _nativeCompat（原生兼容标志）避免 polyfill 污染检测
  if (picker._options.compatCheck === true && picker._nativeCompat) {
    var __missing = [];
    if (!picker._nativeCompat.at) __missing.push('Array.at');
    if (!picker._nativeCompat.typedArrayAt) __missing.push('TypedArray.at');
    if (!picker._nativeCompat.structuredClone) __missing.push('structuredClone');
    if (__missing.length) picker._showCompatWarning(__missing);
  }
  // 用流接口方式加载（fetch 拿字节 → document.hash 可计算显示；静态 URL 原生流式无字节缓存）
  picker.load({ url: 'test.pdf', headers: { 'X-Demo': 'local' } }).then(() => {
    renderJSON(); renderUsers();
    return picker._ensureStampImage();
  }).then(() => {
    info.textContent = '已加载 test.pdf（3页）· document.hash = SHA-256 文件指纹';
  }).catch(e => { info.textContent = '加载失败: ' + e.message; });
}

function initCanvasMode() {
  stage.innerHTML = '';
  const W = 595.28, H = 841.89;
  const cv = document.createElement('canvas');
  const scale = 2;
  cv.width = W * scale; cv.height = H * scale;
  const ctx = cv.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
  ctx.fillStyle = '#333'; ctx.font = 'bold 22px serif'; ctx.fillText('购销合同', 40, 100);
  ctx.font = '13px sans-serif'; ctx.fillStyle = '#666';
  ctx.fillText('甲方：示例科技有限公司', 40, 150);
  ctx.fillText('乙方：示例贸易有限公司', 40, 180);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#999';
  for (let i = 0; i < 14; i++) ctx.fillText('……（合同条款正文占位）……', 40, 230 + i * 32);
  ctx.strokeStyle = '#c33'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
  ctx.strokeRect(400, 600, 150, 90); ctx.fillStyle = '#c33'; ctx.font = '11px sans-serif'; ctx.fillText('盖章区', 455, 645);
  ctx.setLineDash([]);
  ctx.strokeStyle = '#36c'; ctx.strokeRect(80, 680, 180, 50); ctx.fillStyle = '#36c'; ctx.fillText('签字处', 150, 710);

  picker = new PdfStampPicker(stage, { mode: 'stamp', controls: true, users: USERS, currentUser: 'u2' });
  bindPicker(picker);
  window.__picker = picker;   // 供自动回归套件取实例
  picker.setPage({ canvas: cv, width: W, height: H, rotation: 0, pageNumber: 1, totalPages: 1, name: 'canvas合同.pdf' });
  picker._ensureStampImage().then(() => {
    renderUsers();
    info.textContent = '纯画布模式：宿主渲染 canvas，库只做坐标选择';
    renderJSON();
  });
}

function switchTab(activeId) {
  ['tab-container','tab-canvas','tab-modal'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === activeId);
  });
}
document.getElementById('tab-container').addEventListener('click', () => {
  if (document.getElementById('tab-container').classList.contains('active')) return;
  switchTab('tab-container');
  if (picker) { try { picker.destroy(); } catch (e) {} }
  initContainerMode();
});
document.getElementById('tab-canvas').addEventListener('click', () => {
  if (document.getElementById('tab-canvas').classList.contains('active')) return;
  switchTab('tab-canvas');
  if (picker) { try { picker.destroy(); } catch (e) {} }
  initCanvasMode();
});
document.getElementById('tab-modal').addEventListener('click', () => {
  if (document.getElementById('tab-modal').classList.contains('active')) return;
  switchTab('tab-modal');
  PdfStampPicker.openModal({
    source: { url: 'test.pdf', headers: { 'X-Demo': 'modal' } },
    title: '选择签章位置（弹窗）',
    users: USERS,
    currentUser: 'u2',
    confirmText: '确认签章点',
    requireAllUsers: true,   // 每个签署方至少一个签章点才能确认
    pickerOptions: { controls: true, zoom: 'fit-width', mode: 'stamp', toolbar: { url: false, open: false, copyJson: false } },
    onConfirm: json => { const n = json.users.reduce((a, g) => a + g.stamps.length, 0); console.log('确认', n, '个签章点'); }
  }).then(json => {
    if (json) {
      const n = json.users.reduce((a, g) => a + g.stamps.length, 0);
      output.textContent = JSON.stringify(json, null, 2);
      jsonMeta.textContent = `${n} 个签章点`;
      info.textContent = `弹窗确认：返回 ${n} 个签章点（按用户分组）`;
      toast(`弹窗确认：${n} 个签章点`);
    } else {
      toast('已取消');
    }
    switchTab('tab-container');
  });
});

initContainerMode();
</script>
<script src="test-harness.js?v=4.9.5"></script>
<script>
/* 主展示页自动回归（run-all 套件 ⑫）
   此前这一页**完全在自动回归之外**，只能人肉点开看 —— 而它恰恰是唯一同时覆盖
   "容器模式 / 纯画布模式 / 弹窗模式"三条主路径的页面，欠账只是被"每轮人工验一遍"掩盖着。 */
(function () {
  var N = '主展示页';
  __TEST.start('主展示页 index.html（自动回归）');
  __TEST.expect(8);
  function rec(n, pass, detail) { __TEST.record(N + '：' + n, pass, detail); }
  var hash1 = '';
  __TEST.waitFor(function () { return window.__picker || null; }, 40000, '实例未创建')
    .then(function (p) {
      rec('库已加载且版本可读',
        typeof PdfStampPicker === 'function' && !!PdfStampPicker.version, 'v' + PdfStampPicker.version);
      rec('容器模式已创建实例',
        typeof p.toJSON === 'function' && typeof p.destroy === 'function', p.constructor.name);
      return __TEST.waitFor(function () { return p.getTotalPages() > 0 ? p : null; }, 40000, 'PDF 未加载完成');
    })
    .then(function (p) {
      rec('容器模式加载 test.pdf（3 页）', p.getTotalPages() === 3, '页数 ' + p.getTotalPages());
      hash1 = (p.toJSON().document.hash) || '';
      rec('document.hash 是 SHA-256', /^[0-9a-f]{64}$/.test(hash1), hash1 ? hash1.slice(0, 16) + '…' : '空');
      __TEST.tag('docHash', hash1);
      __TEST.tag('totalPages', p.getTotalPages());
      return Promise.resolve(p._ensureStampImage ? p._ensureStampImage() : null).then(function () { return p; });
    })
    .then(function (p) {
      /* 真实指针事件（不是直接调 addStamp）：覆盖"点击 → 屏幕坐标→PDF 坐标 → 入 JSON"整条链路。
         ★ 必须派发到 .psp-overlay（库把 pointerdown/move/up 都绑在这个覆盖层上）；
           派发到它的父元素 .psp-page 只会向上冒泡，监听器永远收不到 —— 表现为"点了没反应"，
           很容易被误判成库的点击功能坏了。
         ★ 派发前必须先等**布局就绪**：库的 _onPointerDown 开头是
           `if (!this._displayW || !this._displayH) return;`，布局没完成时点击被静默丢弃。
           这条门禁是补上来的 —— 此前只等 getTotalPages()>0，于是完整 run-all 里
           **偶发**（4 次挂 1 次）报"点击后签章未进 JSON"，而单独重复跑 8/8 全过。 */
      return __TEST.waitForLayout(p).then(function () { return p; });
    })
    .then(function (p) {
      var pageEl = document.querySelector('#stage .psp-overlay');
      if (!pageEl) throw new Error('未找到 .psp-overlay（库的交互层结构变了？）');
      var r = pageEl.getBoundingClientRect();
      var cx = r.left + r.width * 0.5, cy = r.top + r.height * 0.5;
      ['pointerdown', 'pointerup'].forEach(function (t) {
        pageEl.dispatchEvent(new PointerEvent(t, {
          clientX: cx, clientY: cy, bubbles: true, cancelable: true,
          pointerId: 1, isPrimary: true, pointerType: 'mouse',
          button: 0, buttons: t === 'pointerdown' ? 1 : 0
        }));
      });
      return __TEST.waitFor(function () {
        var n = p.toJSON().users.reduce(function (a, g) { return a + g.stamps.length; }, 0);
        if (n <= 0) return null;
        var out = document.getElementById('output');
        return { n: n, out: out ? out.textContent : '' };
      }, 8000, '点击后签章未进 JSON');
    })
    .then(function (r) {
      rec('真实点击画布 → 签章进 JSON', r.n === 1, '签章数 ' + r.n);
      rec('页面 JSON 面板同步更新（事件桥接生效）',
        /page|stamp|x/i.test(r.out) && r.out.length > 20, (r.out || '').replace(/\s+/g, ' ').slice(0, 70));
      document.getElementById('tab-canvas').click();
      return __TEST.waitFor(function () {
        var p = window.__picker; return (p && p.getTotalPages() === 1) ? p : null;
      }, 8000, '切"纯画布"后未就绪');
    })
    .then(function (p) {
      rec('切"纯画布"→ 实例重建且为 1 页', p.getTotalPages() === 1, '页数 ' + p.getTotalPages());
      document.getElementById('tab-container').click();
      return __TEST.waitFor(function () {
        var q = window.__picker; return (q && q !== p && q.getTotalPages() === 3) ? q : null;
      }, 40000, '切回容器模式未就绪');
    })
    .then(function (q) {
      rec('切回容器模式 → 重新加载 3 页（销毁重建无残留）', q.getTotalPages() === 3, '页数 ' + q.getTotalPages());
      __TEST.finish();
    })
    .catch(function (err) {
      rec('套件未抛错 —— ' + ((err && err.message) || String(err)), false, (err && err.stack) || '');
      __TEST.fail(err);
    });
})();
</script>
</body>
</html>
