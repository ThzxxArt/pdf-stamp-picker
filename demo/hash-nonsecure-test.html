<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哈希回归测试（内网 HTTP / 纯URL / 安全上下文）</title>
<style>
body{background:#16181d;color:#e6e6e6;font:13px/1.7 monospace;padding:14px}
#log div{padding:2px 0}
.ok{color:#4ade80}.bad{color:#f87171}.info{color:#93c5fd}
</style>
</head>
<body>
<h2>PdfStampPicker 哈希回归测试</h2>
<p class="info" id="env"></p>
<div id="log"></div>
<div id="stage" style="position:absolute;left:-9999px;width:400px;height:600px"></div>
<script src="../pdf-stamp-picker.js?v=4.9.7"></script>
<script src="test-harness.js?v=4.9.7"></script>
<script>
var EXPECT = 'f597560249c4154c56cce201f40ad506dd8de378e723f89810c53d0306127b8b';
var log = document.getElementById('log');
function say(msg, cls) {
  var d = document.createElement('div');
  d.className = cls || '';
  d.textContent = msg;
  log.appendChild(d);
}
function stage() {
  var el = document.createElement('div');
  el.style.cssText = 'width:400px;height:600px';
  document.getElementById('stage').appendChild(el);
  return el;
}
function hideSubtle() {
  try {
    Object.defineProperty(Crypto.prototype, 'subtle', { get: function () { return undefined; }, configurable: true });
    return !crypto.subtle;
  } catch (e) { return false; }
}
function mk(opts) { return new PdfStampPicker(stage(), opts || {}); }

var results = [];
function record(name, pass, detail) {
  results.push(pass);
  __TEST.record(name, pass, detail);
  say((pass ? '✅ ' : '❌ ') + name + ' — ' + detail, pass ? 'ok' : 'bad');
}

async function t1_secure_with_headers() {
  var p = mk({ users: [{ id: 'a', name: '杭州云启智能科技有限公司' }] });
  await p.load({ url: 'test.pdf', headers: { 'X-Test': '1' } });
  p.on('hashready', function () {});
  var h = await p.getHash();
  record('① 安全上下文 + headers', h === EXPECT, 'hash=' + (h ? h.slice(0, 20) + '…' : 'NULL'));
}

async function t2_nonsecure_with_headers() {
  var hidden = hideSubtle();
  say('已隐藏 crypto.subtle（模拟内网 HTTP）→ subtle=' + (crypto.subtle ? '有' : '无'), 'info');
  var p = mk({ users: [{ id: 'a', name: '杭州云启智能科技有限公司' }] });
  await p.load({ url: 'test.pdf', headers: { 'X-Test': '1' } });
  var h = await p.getHash();
  record('② 内网HTTP + headers（纯JS兜底）', hidden && h === EXPECT, 'hash=' + (h ? h.slice(0, 20) + '…' : 'NULL'));
}

async function t3_nonsecure_plain_url_hashUrl() {
  var p = mk({ users: [{ id: 'a', name: '杭州云启智能科技有限公司' }], hashUrl: true });
  var eventHash = null;
  p.on('hashready', function (e) { eventHash = e.hash; });
  await p.load('test.pdf');
  var h = await p.getHash();
  record('③ 内网HTTP + 纯URL + hashUrl:true', h === EXPECT, 'getHash=' + (h ? h.slice(0, 20) + '…' : 'NULL') + ' / hashready事件=' + (eventHash ? eventHash.slice(0, 12) + '…' : '未触发'));
}

async function t4_plain_url_default() {
  var p = mk({ users: [{ id: 'a', name: '杭州云启智能科技有限公司' }] });
  await p.load('test.pdf');
  var j = p.toJSON();
  record('④ 纯URL 默认(hashUrl 未开) → 预期无 hash 字段',
    !j.document.hash && !('hash' in j.document),
    'document.hash=' + (j.document.hash || '字段不存在') + '（符合设计：不额外下载；需要就开 hashUrl:true）');
}

async function t5_nonsecure_bigfile_transfer_race() {
  // 回归 v4.8.28 修复：pdf.js 会把 ArrayBuffer transfer 给 worker（主线程侧 detached），
  // 而纯 JS SHA-256 兜底是分块异步读取的 —— 若不等哈希算完就 _getDoc，后续分块读到全 0，
  // 会静默产出【错误但格式正常】的哈希。20MB 文件可稳定复现（≤3.2MB 时靠时序侥幸通过）。
  var BIG_EXPECT = '1d9778fb38aae8aa72d83a2a98f24f53cb6ea0cfd474824f8011df41cad9cb13';
  var exists = await fetch('huge.pdf', { method: 'HEAD', cache: 'no-store' }).then(function (r) { return r.ok; }).catch(function () { return false; });
  if (!exists) {
    say('⏭ ⑤ 大文件 transfer 竞态 — 跳过（缺 huge.pdf：python3 test/gen_big_pdf.py demo/huge.pdf 8 2500000）', 'info');
    return;
  }
  var p = mk({ users: [{ id: 'a', name: '杭州云启智能科技有限公司' }] });
  await p.load({ url: 'huge.pdf', headers: { 'X-Test': '1' } });
  var h = await p.getHash();
  record('⑤ 内网HTTP + 20MB 大文件（transfer 竞态回归）', h === BIG_EXPECT,
    'hash=' + (h ? h.slice(0, 20) + '…' : 'NULL') + ' | 期望=' + BIG_EXPECT.slice(0, 20) + '…');
}

(async function () {
  __TEST.start('哈希回归测试（内网 HTTP / 纯URL / 安全上下文）');
  __TEST.expect(5);
  document.getElementById('env').textContent =
    '库版本=' + PdfStampPicker.version + ' · isSecureContext=' + window.isSecureContext +
    ' · 期望哈希=' + EXPECT.slice(0, 20) + '…';
  try {
    await t1_secure_with_headers();
    await t2_nonsecure_with_headers();
    await t3_nonsecure_plain_url_hashUrl();
    await t4_plain_url_default();
    await t5_nonsecure_bigfile_transfer_race();
  } catch (e) {
    say('❌ 异常：' + e.message, 'bad');
    record('用例执行', false, '异常：' + e.message);
  }
  var pass = results.filter(Boolean).length;
  say('——— 通过 ' + pass + ' / ' + results.length, pass === results.length ? 'ok' : 'bad');
  __TEST.finish();
})();
</script>
</body>
</html>
